events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # Map for WebSocket support (Upgrade header)
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        # Switcher listening port inside the container
        listen       3010;
        server_name  localhost;

        # ----------------------------------------------------------------------
        # Common Proxy Headers (applied by default to proxy locations)
        # ----------------------------------------------------------------------
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # ----------------------------------------------------------------------
        # Favicon optimization (prevent unnecessary 404 log clutter)
        # ----------------------------------------------------------------------
        location = /favicon.ico {
            log_not_found off;
            access_log off;
        }

        # ----------------------------------------------------------------------
        # PATTERN 1: Routing with Subpath Stripping (e.g. /app1/ -> http://target:port/)
        # Useful when target app expects requests at root '/'
        # ----------------------------------------------------------------------
        # Ensure trailing slash redirect so relative assets (CSS, JS) load properly
        location = /app1 {
            return 301 $scheme://$http_host$uri/;
        }
        location /app1/ {
            # Note the trailing slash at the end of proxy_pass.
            # It tells Nginx to strip '/app1/' and forward requests to '/' on target.
            proxy_pass http://host.docker.internal:4000/;
        }

        # ----------------------------------------------------------------------
        # PATTERN 2: Routing with Path Preservation (e.g. /app2 -> http://target:port/app2)
        # Useful when target app knows it is mounted under /app2
        # ----------------------------------------------------------------------
        location /app2 {
            proxy_pass http://host.docker.internal:5000;
        }

        # ----------------------------------------------------------------------
        # PATTERN 3: Routing to a Custom Host defined in extra_hosts
        # Useful for projects configured with custom local domains (e.g. dev-service.local)
        # ----------------------------------------------------------------------
        location = /custom-service {
            return 301 $scheme://$http_host$uri/;
        }
        location /custom-service/ {
            proxy_pass http://app1.local:3080/;
        }

        # ----------------------------------------------------------------------
        # PATTERN 4: Root Location ('/')
        # Choose between:
        # 1) Serving the built-in Switcher Dashboard (default)
        # 2) Proxying to your main application
        # ----------------------------------------------------------------------
        location / {
            # Option A: Built-in Switcher Status Page
            root   /usr/share/nginx/html;
            index  index.html;
            try_files $uri $uri/ /index.html;

            # Option B: Uncomment below to proxy root traffic to a main service
            # proxy_pass http://host.docker.internal:3000;
        }
    }
}
